[package]
name = "bookshadow"
version = "0.8.0"
description = "书影 BookShadow — 家庭藏书管理"
authors = ["Sun Jiaming"]
edition = "2021"

[lib]
name = "bookshadow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
dirs-next = "2"
scraper = "0.21"
tauri-plugin-window-state = "2.4.1"
rxing = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSHTTPCookie", "NSArray"] }
block2 = "0.6.2"
